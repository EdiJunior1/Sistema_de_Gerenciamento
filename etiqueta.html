<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etiqueta - {{ equipamento.codigo_identificacao }}</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f4f8;
           font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: #1f2937; }
    .etiqueta { background: #fff; border: 2px solid #111827; border-radius: 14px; padding: 28px 32px;
                width: 320px; text-align: center; }
    .etiqueta svg { width: 220px; height: 220px; }
    h1 { font-size: 20px; margin: 12px 0 4px; }
    .codigo { font-size: 26px; font-weight: 700; letter-spacing: 1px; margin: 0; }
    .categoria { color: #6b7280; margin: 0 0 14px; }
    .uuid { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: #6b7280; word-break: break-all; }
    .acoes { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
    button { font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 8px; border: 1px solid #cfd4df;
             background: #fff; cursor: pointer; }
    button.principal { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    @media print { body { background: #fff; } .acoes { display: none; } }
  </style>
</head>
<body>
  <div class="etiqueta">
    {{ qr_svg|safe }}
    <p class="codigo">{{ equipamento.codigo_identificacao }}</p>
    <h1>{{ equipamento.nome }}</h1>
    <p class="categoria">{{ equipamento.categoria }}</p>
    <p class="uuid">{{ equipamento.qr_code_uuid }}</p>
    <div class="acoes">
      <button class="principal" onclick="window.print()">Imprimir</button>
      <button onclick="window.close()">Fechar</button>
    </div>
  </div>
</body>
</html>
